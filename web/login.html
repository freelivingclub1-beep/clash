<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clash — sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d0f13'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='%23ffe24b'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="loginBody">
<main class="loginWrap">
  <form id="form" class="panel loginPanel" autocomplete="on">
    <div class="brand loginBrand">
      <span class="dot"></span>
      <h1>Clash</h1>
    </div>
    <p class="loginHint">Enter the password for this instance.</p>
    <label class="field">
      <span>Password</span>
      <input id="password" type="password" name="password" autocomplete="current-password"
             autofocus required />
    </label>
    <button type="submit" class="primary loginButton">Sign in</button>
    <p id="error" class="error hidden"></p>
  </form>
</main>

<script>
  const form = document.getElementById("form");
  const error = document.getElementById("error");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    error.classList.add("hidden");
    const button = form.querySelector("button");
    button.disabled = true;
    try {
      const response = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: document.getElementById("password").value }),
      });
      if (response.ok) {
        // The cookie is set by the server; go where the user was headed.
        const next = new URLSearchParams(location.search).get("next") || "/";
        location.href = next;
        return;
      }
      const body = await response.json().catch(() => ({}));
      error.textContent = body.detail || "Wrong password.";
      error.classList.remove("hidden");
    } catch (err) {
      error.textContent = "Could not reach the server.";
      error.classList.remove("hidden");
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
